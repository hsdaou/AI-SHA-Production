[Service]
# The Orin GPU is INTEGRATED and shares the 8 GB system RAM with ROS, Whisper and
# ChromaDB. Three settings make GPU inference actually work here:
#
#  OLLAMA_IGPU_ENABLE    - Ollama skips integrated GPUs unless told otherwise, so
#      llama3.2:1b silently ran 100% on the CPU (30-80 s per answer).
#  OLLAMA_CONTEXT_LENGTH - llama3.2 advertises a 131k context; sized for that the
#      KV cache alone asks for 2 GiB, cudaMalloc fails ("out of memory") and
#      llama-server segfaults. Capping it keeps the KV cache small. The robot
#      only feeds ~5 knowledge chunks, so 2048 is plenty.
#  OLLAMA_KEEP_ALIVE     - keep the model resident; otherwise every question pays
#      a full 1.5 GB GPU reload. (admin_node also passes keep_alive per request.)
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_CONTEXT_LENGTH=2048"
Environment="OLLAMA_KEEP_ALIVE=30m"
