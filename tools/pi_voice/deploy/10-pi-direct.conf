# Jetson-side drop-in: /etc/systemd/system/aisha-console.service.d/10-pi-direct.conf
#
# Point the console at the Pi over the DIRECT cable rather than the house wifi
# address. The robot has to work in a corridor with no router and no internet, so
# nothing in the answer path may depend on the house network.
# aisha_watch.py reads each of these with os.environ.get(..., <wifi default>).
[Service]
Environment=AISHA_LIDAR_URL=http://192.168.77.2:8090/scan.json
Environment=AISHA_MAP_URL=http://192.168.77.2:8091
Environment=AISHA_VOLUME_URL=http://192.168.77.2:8092
Environment=AISHA_SPEECH_URL=http://192.168.77.2:8093/say
Environment=AISHA_SPEAKING_URL=http://192.168.77.2:8093/speaking
