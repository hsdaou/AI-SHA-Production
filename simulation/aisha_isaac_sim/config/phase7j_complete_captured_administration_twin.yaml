    camera: [-1.0, 2.50, 2.60]
    look_at: [9.0, -0.10, 0.68]
    focal_length_mm: 15.0
    segments: [5]
  - title: "Principal suite - registered scan approach"
    operator_label: "PRINCIPAL SUPPLEMENT AT 1:1 SCALE"
    camera: [2.55, -2.65, 1.84]
    look_at: [6.75, -7.35, 0.70]
    focal_length_mm: 15.0
    segments: [6, 7]
    source_fraction: [0.60, 1.0]
  - title: "Principal visit in capture-derived office"
    operator_label: "ROOMPLAN GEOMETRY + PHOTO PBR FINISHES"
    camera: [10.00, -5.00, 4.00]
    look_at: [7.20, -7.80, 0.55]
    focal_length_mm: 18.0
    cutaway: true
    segments: [8, 9]
  - title: "Mission complete in the captured-area twin"
    operator_label: "12/12 LEGS COMPLETE"
    camera: [0.2, 5.0, 3.0]
    look_at: [5.1, -1.2, 0.62]
    focal_length_mm: 15.0
    segments: [10, 11]

presentation_disclosures:
  overlay: >-
    Recorded poses from the accepted live Nav2/learned-safety mission replayed
    in the complete captured-area semantic twin; visual replay, not live policy execution.
  environment: >-
    The complete primary RoomPlan capture is included at 1:1 scale and the
    Principal supplement is independently registered. RoomPlan is semantic
    geometry, not a complete phototextured photogrammetric as-built survey.
  vice_principal_interior_assumed_because_locked: true
  narrowest_administration_reported_door_width_m: 0.85
  vice_principal_presentation_assumption_m: 0.875
  principal_door_width_presentation_assumption_m: 0.90
  reported_door_height_m: 2.12
  central_polygon_step_down_m: 0.20
  principal_visit_uses_temporary_architectural_cutaway: true
  raw_scan_used_for_collision: false
  physical_localization_credit: false
  physical_safety_credit: false
  physical_release: false

