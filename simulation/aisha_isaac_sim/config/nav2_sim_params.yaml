# Nav2 Jazzy parameter candidate for the Rev D differential-drive AI-SHA in Isaac Sim.
# Static validation is available now. Runtime validation needs the Nav2 packages and
# a measured administration occupancy map; neither is silently substituted.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.5
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker, position_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Office waypoints intentionally include in-place 90/180 degree turns.
      # PoseProgressChecker counts that angular progress; SimpleProgressChecker
      # watches translation only and falsely aborts a valid pivot.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 90.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # DWB's terminal rotation phase begins roughly one chassis-quarter from
      # the waypoint. Keep the action goal tolerance aligned so it cannot stop
      # in a zero-command terminal deadlock just outside a stricter checker.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    position_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.55
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      # The Rev D wheel drives have a measurable in-place static-friction
      # deadband in the furnished USD scene. Commands below 0.30 rad/s can
      # start a pivot and then stall; keep terminal pivots above that floor.
      min_speed_theta: 0.30
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.50
      decel_lim_x: -0.25
      decel_lim_y: 0.0
      decel_lim_theta: -0.50
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.20
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.40
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.40
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      # A factor of five attenuates the final pivot command into the measured
      # static-friction deadband before the yaw checker can succeed.
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.025
      footprint: "[[0.725,0.384],[0.725,-0.384],[-0.455,-0.384],[-0.455,0.384]]"
      footprint_padding: 0.08
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: crown_scan front_scan
        crown_scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
        front_scan:
          topic: /front_scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.025
      track_unknown_space: false
      footprint: "[[0.725,0.384],[0.725,-0.384],[-0.455,-0.384],[-0.455,0.384]]"
      footprint_padding: 0.08
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: crown_scan front_scan
        crown_scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
        front_scan:
          topic: /front_scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    # Supplied by launch only after the measured-site occupancy map is generated.
    yaml_filename: ""

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.50

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.55]
    min_velocity: [0.0, 0.0, -0.55]
    max_accel: [0.25, 0.0, 0.50]
    max_decel: [-0.25, 0.0, -0.50]
    odom_topic: /odom
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.30
