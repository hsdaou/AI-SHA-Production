# Isolated Phase 7C profile. The accepted administration profiles remain frozen.
# Explicit per-source height limits are required by Nav2 Jazzy: its observation
# source default is 0.0 m and otherwise filters every real AI-SHA LiDAR return.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 60
    min_particles: 200
    max_particles: 800
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.5
    tf_broadcast: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 60.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Phase 7C proves branch selection and collision-free arrival, not a
      # terminal pose. Avoid a presentation-proxy static-friction pivot after
      # the complete rectangular footprint has entered the goal disc.
      stateful: false
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.45
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.65
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.30
      acc_lim_x: 0.30
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -0.60
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.20
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.08
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.35
      PathDist.scale: 32.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.725,0.384],[0.725,-0.384],[-0.455,-0.384],[-0.455,0.384]]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: crown_scan front_scan
        crown_scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.20
          observation_persistence: 0.50
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
        front_scan:
          topic: /front_scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.00
          observation_persistence: 0.50
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[0.725,0.384],[0.725,-0.384],[-0.455,-0.384],[-0.455,0.384]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: crown_scan front_scan
        crown_scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.20
          observation_persistence: 1.00
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
        front_scan:
          topic: /front_scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.00
          observation_persistence: 1.00
          obstacle_min_range: 0.12
          obstacle_max_range: 8.0
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
