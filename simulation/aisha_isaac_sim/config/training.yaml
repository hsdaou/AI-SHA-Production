date: "2026-08-22"

software_baseline:
  isaac_sim_version: "5.1.0-rc.19+release.26219.9c81211b.gl"
  isaac_lab_commit: "80094be3245"
  ros_distribution: jazzy
  gpu: "NVIDIA GeForce RTX 5080 16 GB"
  version_policy: "pin these versions for every comparable training run"

task:
  gym_id: "Isaac-AISHA-OfficeNav-Direct-v0"
  purpose: "learn physics-driven straight approach and traversal through an office doorway"
  status: "state_observation_training_foundation"
  control_mode: "wheel_joint_velocity_targets"
  forbidden_shortcut: "direct root pose or USD transform animation"
  policy_rate_hz: 30
  physics_rate_hz: 120
  episode_length_s: 18.0
  default_parallel_environments: 64

sensor_curriculum:
  gym_id: "Isaac-AISHA-BlockA-SensorNav-Direct-v0"
  purpose: "learn goal-conditioned traversal of the complete presentation route as 12 directed waypoint segments"
  status: "plan_derived_ray_sensor_training"
  course_usd: "simulation/aisha_isaac_sim/usd/block_a_training_course.usda"
  control_mode: "wheel_joint_velocity_targets"
  forbidden_shortcut: "direct root pose or USD transform animation"
  policy_rate_hz: 30
  physics_rate_hz: 120
  lidar_update_rate_hz: 10
  episode_length_s: 55.0
  default_parallel_environments: 32
  selected_training_seed: 144
  route_segment_count: 12
  observation_count: 46
  observation_terms:
    state_and_goal: 10
    lidar_ranges: 36
  action_contract:
    terms: [normalized_forward_command, normalized_angular_command]
    linear_velocity_range_mps: [0.0, 0.50]
    angular_velocity_range_rad_s: [-1.0, 1.0]
    stop_behavior: "the learned policy may stop; the route supervisor also enforces stops and office dwell timing"
  lidar_contract:
    source: "LD19 specification recorded by the AI-SHA production repository"
    source_scan_rate_hz: 10
    source_accuracy_m: 0.03
    source_range_m: [0.12, 12.0]
    simulated_max_range_m: 10.0
    horizontal_resolution_deg: 10.0
    implementation: "Isaac Lab MultiMeshRayCaster attached to the AI-SHA lidar_link"
    limitation: "scalable geometric rays, not an RTX-rendered sensor model"
  collision_termination:
    implementation: "ray intersection with the configured rectangular robot footprint envelope"
    reason: "Isaac Sim 5.1 fixed-link contact reporter is unavailable on the composed production USD"
    physical_colliders_present: true
  randomization:
    start_lateral_m: [-0.05, 0.05]
    start_yaw_deg: [-8.0, 8.0]
    goal_xy_m: [-0.03, 0.03]
  presentation_assumptions:
    - "route waypoints are navigation centerlines interpreted from A1 page 2, Block A"
    - "principal_turn is placed on the corridor centerline at [3.45, -3.45] to avoid the diagonal wall"
    - "both office door clear widths are 1.40 m presentation assumptions, not site measurements"
    - "both office thresholds are modeled flush (0 mm) for presentation because the rigid castor proxy cannot support threshold-contact conclusions"
    - "office stop points are placed far enough inside each doorway for the declared 1.64 m pivot envelope; chained office visits use a tighter 0.20 m learned-goal tolerance"
    - "hallway_return first reaches the east atrium opening; the policy is not trained to cut diagonally through a wall"
    - "door clearances remain presentation assumptions until site measurement"
  anti_reward_hacking:
    rule: "stationary shaping is below the time penalty and motion below 0.03 m/s receives an additional -0.02 per policy step"
    purpose: "force the deterministic mean policy to commit to doorway traversal instead of relying on exploration noise"
  segment_sampling_weights: [1, 1, 1, 10, 10, 1, 1, 1, 10, 10, 1, 1]
  hard_segment_curriculum_reason: "open-loop PhysX audit proved the assumed 3/5 mm threshold colliders stopped the rigid front-castor proxy exactly 0.415 m before the strips; the presentation course now assumes flush thresholds and keeps physical threshold release blocked"
  held_out_acceptance_gate:
    episodes_per_segment: 48
    overall_success_rate_min: 0.80
    overall_collision_rate_max: 0.15
    every_segment_success_rate_min: 0.60
    office_threshold_segment_ids: [3, 4, 8, 9]
    office_threshold_success_rate_min: 0.70
    note: "declared before corrected-policy candidate evaluation and unchanged through revision TRAINING-SENSOR-G; passing supports presentation playback only"

